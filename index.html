<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>PullTube — Hero Paste</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f7f3ea;
    --paper-2: #efe9d9;
    --ink: #1c1a17;
    --ink-2: #46413a;
    --muted: #8a8275;
    --line: #1c1a17;
    --hairline: #d8cfba;
    --accent: #d94e2c;
    --accent-soft: #fbe8e2;
    --good: #2f7a4a;
    --shadow-1: 0 1px 0 rgba(0,0,0,.04), 0 4px 14px rgba(28,26,23,.08);
    --shadow-2: 0 1px 0 rgba(0,0,0,.06), 0 24px 60px rgba(28,26,23,.18);
  }
  html.dark {
    --paper: #161513;
    --paper-2: #1f1d1a;
    --ink: #f3eee0;
    --ink-2: #c9c1ad;
    --muted: #7d7665;
    --line: #f3eee0;
    --hairline: #2c2a25;
    --accent: #ff7a55;
    --accent-soft: rgba(255,122,85,.16);
    --shadow-2: 0 1px 0 rgba(255,255,255,.04), 0 24px 60px rgba(0,0,0,.55);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
    background:
      radial-gradient(circle at 15% 0%, color-mix(in oklab, var(--accent), transparent 86%), transparent 45%),
      radial-gradient(circle at 90% 100%, color-mix(in oklab, var(--paper-2), transparent 30%), transparent 50%),
      var(--paper);
    color: var(--ink);
    min-height: 100vh;
    transition: background-color .25s, color .25s;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: '';
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image: radial-gradient(circle, color-mix(in oklab, var(--ink), transparent 95%) 1px, transparent 1px);
    background-size: 24px 24px;
    opacity: .35;
    mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
  }
  /* Header */
  header.top {
    position: relative; z-index: 2;
    padding: 36px 56px 20px;
    display: flex; align-items: center; gap: 24px; flex-wrap: wrap;
  }
  .wordmark {
    display: flex; align-items: baseline; gap: 6px;
    font-family: 'Caveat', cursive;
    font-weight: 700; font-size: 44px; line-height: 1;
    letter-spacing: -.5px;
  }
  .wordmark .pull { color: var(--ink); transform: rotate(-2deg); display: inline-block; }
  .wordmark .tube { color: var(--accent); transform: rotate(1deg); display: inline-block; }
  .wordmark .arrow { color: var(--accent); transform: translateY(-4px) rotate(-6deg); margin-left: 4px; }
  .crumbs {
    margin-left: auto;
    font-family: 'Instrument Serif', serif;
    font-size: 18px; font-style: italic; color: var(--muted);
    letter-spacing: .01em;
  }
  .crumbs b { color: var(--ink); font-weight: 400; font-style: normal; font-family: 'Inter', sans-serif; font-size: 13px; padding: 3px 8px; border: 1px solid var(--line); border-radius: 999px; margin-left: 4px; }
  /* State chips */
  nav.states {
    position: relative; z-index: 2;
    padding: 0 56px 28px;
    display: flex; gap: 8px; align-items: center;
  }
  nav.states .label {
    font-family: 'Instrument Serif', serif; font-style: italic;
    font-size: 18px; color: var(--muted); margin-right: 8px;
  }
  nav.states button {
    appearance: none; cursor: pointer;
    font: 500 13px/1 'Inter', sans-serif;
    color: var(--ink-2);
    background: transparent;
    padding: 8px 14px;
    border: 1px solid var(--hairline);
    border-radius: 999px;
    transition: all .15s;
  }
  nav.states button:hover { border-color: var(--line); color: var(--ink); }
  nav.states button.active {
    background: var(--ink); color: var(--paper);
    border-color: var(--ink);
  }
  nav.states .dot {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: currentColor; margin-right: 6px; vertical-align: middle;
  }
  /* Stage */
  main {
    position: relative; z-index: 1;
    padding: 0 56px 96px;
    display: flex; justify-content: center;
  }
  .frame {
    position: relative;
    background: var(--paper);
    border-radius: 16px;
    box-shadow: var(--shadow-2), 0 0 0 1px rgba(0,0,0,.08);
    overflow: hidden;
    transition: opacity .25s ease;
  }
  html.dark .frame { box-shadow: var(--shadow-2), 0 0 0 1px rgba(255,255,255,.06); }
  /* Mac titlebar */
  .titlebar {
    height: 36px;
    display: flex; align-items: center; gap: 8px;
    padding: 0 14px;
    border-bottom: 1px solid var(--hairline);
    background: linear-gradient(180deg, color-mix(in oklab, var(--paper), white 4%), var(--paper));
  }
  html.dark .titlebar { background: linear-gradient(180deg, var(--paper-2), var(--paper)); }
  .tl-dot { width: 12px; height: 12px; border-radius: 50%; }
  .tl-r { background: #ff5f56; }
  .tl-y { background: #ffbd2e; }
  .tl-g { background: #28c93f; }
  .tl-title {
    flex: 1; text-align: center;
    font: 500 12px/1 'Inter', sans-serif;
    color: var(--muted);
    letter-spacing: .02em;
  }
  /* Footer note */
  footer.note {
    position: relative; z-index: 1;
    text-align: center; padding: 0 56px 64px;
    font-family: 'Instrument Serif', serif; font-style: italic;
    font-size: 16px; color: var(--muted);
  }
  /* Scribble accents */
  .scribble {
    display: inline-block; line-height: 0;
  }
  /* keyframes */
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .fade { animation: fadeIn .35s ease; }
  @keyframes shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: .35; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="wordmark">
    <span class="pull">Pull</span><span class="tube">Tube</span>
    <svg width="58" height="40" viewBox="0 0 58 40" fill="none" class="arrow" aria-hidden="true">
      <path d="M3 18 Q 24 8, 50 22" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/>
      <path d="M52 22 L 44 17 M52 22 L 46 28" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    </svg>
  </div>
  <div class="crumbs">
    Direction 01 — <em>Hero Paste</em><b>polished</b>
  </div>
</header>

<nav class="states" id="states">
  <span class="label">show me when…</span>
  <button data-state="empty"><span class="dot" style="background: var(--muted);"></span>Empty</button>
  <button class="active" data-state="mid"><span class="dot" style="background: var(--accent);"></span>Pulling</button>
  <button data-state="done"><span class="dot" style="background: var(--good);"></span>Done</button>
  <span style="flex:1"></span>
  <button id="darkBtn" title="Toggle dark mode" aria-label="Toggle dark mode">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" style="vertical-align: -2px; margin-right: 6px;"><path d="M11 8.5A4.5 4.5 0 0 1 5.5 3 5 5 0 1 0 11 8.5z" fill="currentColor"/></svg>
    Theme
  </button>
</nav>

<main>
  <div id="root"></div>
</main>

<footer class="note">
  Paste a link · pull the video · move on with your day.
</footer>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel">
// Polished Hero Paste — single direction, mid-fi
// Three states: empty (spotlight), mid (active downloads), done (recent).

const { useEffect, useState, useRef } = React;

// ─── Helpers ────────────────────────────────────────────────────────────
const fmtBytes = (mb) => mb >= 1024 ? `${(mb/1024).toFixed(1)} GB` : `${Math.round(mb)} MB`;

// ─── Iconography (line, monoweight) ─────────────────────────────────────
const I = {
  paste: (s = 14) => <svg width={s} height={s} viewBox="0 0 16 16" fill="none"><path d="M5 3h6v2H5zM4 4h8v10H4z" stroke="currentColor" strokeWidth="1.2" strokeLinejoin="round"/><path d="M6 8h4M6 11h3" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round"/></svg>,
  link: (s = 14) => <svg width={s} height={s} viewBox="0 0 16 16" fill="none"><path d="M9 5l2-2a2.5 2.5 0 0 1 3.5 3.5l-2 2M7 11l-2 2a2.5 2.5 0 0 1-3.5-3.5l2-2M5.5 10.5l5-5" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/></svg>,
  play: (s = 14) => <svg width={s} height={s} viewBox="0 0 16 16" fill="currentColor"><path d="M5 3.5v9l8-4.5z"/></svg>,
  pause: (s = 14) => <svg width={s} height={s} viewBox="0 0 16 16" fill="currentColor"><rect x="4" y="3" width="3" height="10" rx="1"/><rect x="9" y="3" width="3" height="10" rx="1"/></svg>,
  x: (s = 14) => <svg width={s} height={s} viewBox="0 0 16 16" fill="none"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/></svg>,
  check: (s = 14) => <svg width={s} height={s} viewBox="0 0 16 16" fill="none"><path d="M3 8.5l3.5 3.5L13 5" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  folder: (s = 14) => <svg width={s} height={s} viewBox="0 0 16 16" fill="none"><path d="M2 4.5A1.5 1.5 0 0 1 3.5 3h2.7c.4 0 .8.2 1.1.5L8.5 5h4A1.5 1.5 0 0 1 14 6.5v6A1.5 1.5 0 0 1 12.5 14h-9A1.5 1.5 0 0 1 2 12.5z" stroke="currentColor" strokeWidth="1.2" strokeLinejoin="round"/></svg>,
  gear: (s = 14) => <svg width={s} height={s} viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="2.4" stroke="currentColor" strokeWidth="1.2"/><path d="M8 1v2M8 13v2M3.05 3.05l1.4 1.4M11.55 11.55l1.4 1.4M1 8h2M13 8h2M3.05 12.95l1.4-1.4M11.55 4.45l1.4-1.4" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round"/></svg>,
  retry: (s = 14) => <svg width={s} height={s} viewBox="0 0 16 16" fill="none"><path d="M13 4v3h-3M3 12v-3h3" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/><path d="M11.5 6.5A4 4 0 0 0 4 8M4.5 9.5A4 4 0 0 0 12 8" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/></svg>,
  drop: (s = 14) => <svg width={s} height={s} viewBox="0 0 16 16" fill="none"><path d="M8 2v8M5 7l3 3 3-3" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/><path d="M3 13h10" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/></svg>,
  cmd: (s = 12) => <svg width={s} height={s} viewBox="0 0 12 12" fill="none"><path d="M4 1.5A1.5 1.5 0 1 1 2.5 3v0M2.5 3H4v3M4 6V3M4 6H2.5A1.5 1.5 0 1 0 4 7.5V6zM8 1.5A1.5 1.5 0 1 0 9.5 3v0M9.5 3H8v3M8 6V3M8 6h1.5A1.5 1.5 0 1 1 8 7.5V6zM4 6h4" stroke="currentColor" strokeWidth="1" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  audio: (s = 14) => <svg width={s} height={s} viewBox="0 0 16 16" fill="none"><path d="M3 10V6h2l3-3v10L5 10z" stroke="currentColor" strokeWidth="1.2" strokeLinejoin="round"/><path d="M11 6c.7.6 1 1.3 1 2s-.3 1.4-1 2" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round"/></svg>,
  film: (s = 14) => <svg width={s} height={s} viewBox="0 0 16 16" fill="none"><rect x="2" y="3" width="12" height="10" rx="1.5" stroke="currentColor" strokeWidth="1.2"/><path d="M5 3v10M11 3v10M2 6h12M2 10h12" stroke="currentColor" strokeWidth="1.2"/></svg>,
};

// ─── Painted thumbnail — gradient + frame, no real images ───────────────
function PaintedThumb({ w = 96, h = 56, hue = 18, label, kind = 'video' }) {
  return (
    <div style={{
      position: 'relative', width: w, height: h, borderRadius: 6, overflow: 'hidden',
      background: `linear-gradient(135deg, oklch(.55 .14 ${hue}) 0%, oklch(.42 .12 ${(hue + 60) % 360}) 60%, oklch(.32 .1 ${(hue + 100) % 360}) 100%)`,
      boxShadow: 'inset 0 0 0 1px rgba(0,0,0,.12), inset 0 1px 0 rgba(255,255,255,.18)',
    }}>
      {/* abstract shapes */}
      <svg width={w} height={h} style={{ position: 'absolute', inset: 0, opacity: .55 }}>
        <circle cx={w * 0.7} cy={h * 0.3} r={h * 0.45} fill="rgba(255,255,255,.18)"/>
        <circle cx={w * 0.2} cy={h * 0.85} r={h * 0.35} fill="rgba(0,0,0,.15)"/>
        <path d={`M0 ${h*.7} Q${w*.5} ${h*.4} ${w} ${h*.8} L${w} ${h} L0 ${h} Z`} fill="rgba(255,255,255,.12)"/>
      </svg>
      {label && (
        <div style={{
          position: 'absolute', right: 4, bottom: 4,
          font: '500 9px/1 "Inter"', color: 'white', background: 'rgba(0,0,0,.6)',
          padding: '2px 5px', borderRadius: 3, letterSpacing: '.02em',
        }}>{label}</div>
      )}
      {kind === 'audio' && (
        <div style={{ position: 'absolute', left: 6, top: 6, color: 'white', opacity: .8 }}>
          {I.audio(12)}
        </div>
      )}
    </div>
  );
}

// ─── Atoms ──────────────────────────────────────────────────────────────
function Btn({ children, primary, ghost, small, icon, onClick, style = {}, disabled }) {
  const base = {
    appearance: 'none', cursor: disabled ? 'default' : 'pointer',
    display: 'inline-flex', alignItems: 'center', gap: 6,
    font: `600 ${small ? 12 : 13}px/1 'Inter', sans-serif`,
    padding: small ? '6px 10px' : '8px 14px',
    borderRadius: small ? 6 : 8,
    border: '1px solid var(--hairline)',
    color: 'var(--ink)',
    background: 'color-mix(in oklab, var(--paper), white 4%)',
    transition: 'all .15s',
    opacity: disabled ? .5 : 1,
  };
  if (primary) Object.assign(base, {
    background: 'var(--ink)', color: 'var(--paper)', borderColor: 'var(--ink)',
  });
  if (ghost) Object.assign(base, {
    background: 'transparent', borderColor: 'transparent',
  });
  return (
    <button style={{ ...base, ...style }} onClick={onClick} disabled={disabled}>
      {icon}{children}
    </button>
  );
}

function Pill({ children, accent, mono }) {
  return (
    <span style={{
      display: 'inline-flex', alignItems: 'center', gap: 4,
      font: `500 11px/1 ${mono ? "'JetBrains Mono', monospace" : "'Inter', sans-serif"}`,
      padding: '4px 8px', borderRadius: 999,
      color: accent ? 'var(--accent)' : 'var(--ink-2)',
      background: accent ? 'var(--accent-soft)' : 'color-mix(in oklab, var(--ink), transparent 92%)',
      letterSpacing: mono ? '0' : '.01em',
      whiteSpace: 'nowrap',
    }}>{children}</span>
  );
}

function Kbd({ children }) {
  return (
    <span style={{
      display: 'inline-flex', alignItems: 'center', gap: 2,
      font: '500 11px/1 "JetBrains Mono", monospace',
      padding: '3px 6px', borderRadius: 4,
      border: '1px solid var(--hairline)',
      background: 'color-mix(in oklab, var(--paper), white 3%)',
      color: 'var(--ink-2)',
      boxShadow: '0 1px 0 var(--hairline)',
    }}>{children}</span>
  );
}

// ─── Progress ring + bar ────────────────────────────────────────────────
function Ring({ value = 0, size = 36, thick = 3 }) {
  const r = (size - thick) / 2;
  const c = 2 * Math.PI * r;
  const off = c - (value / 100) * c;
  return (
    <svg width={size} height={size} style={{ display: 'block' }}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--hairline)" strokeWidth={thick}/>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--accent)" strokeWidth={thick}
              strokeDasharray={c} strokeDashoffset={off} strokeLinecap="round"
              transform={`rotate(-90 ${size/2} ${size/2})`}
              style={{ transition: 'stroke-dashoffset .4s ease' }}/>
      <text x="50%" y="50%" textAnchor="middle" dominantBaseline="central"
            style={{ font: '600 10px "Inter"', fill: 'var(--ink)' }}>{Math.round(value)}</text>
    </svg>
  );
}

function Bar({ value = 0, height = 6, indeterminate, animate }) {
  return (
    <div style={{ position: 'relative', width: '100%', height, borderRadius: height,
                  background: 'color-mix(in oklab, var(--ink), transparent 92%)', overflow: 'hidden' }}>
      <div style={{
        position: 'absolute', left: 0, top: 0, bottom: 0,
        width: `${Math.max(0, Math.min(100, value))}%`,
        background: animate
          ? 'linear-gradient(90deg, var(--accent) 0%, color-mix(in oklab, var(--accent), white 25%) 50%, var(--accent) 100%)'
          : 'var(--accent)',
        backgroundSize: '200% 100%',
        animation: animate ? 'shimmer 2s linear infinite' : 'none',
        transition: 'width .4s ease',
        borderRadius: height,
      }}/>
    </div>
  );
}

// ─── Hero input — central focus, big, with paste action ─────────────────
function HeroInput({ value, onChange, onPaste, focused, big = true, accent }) {
  const ref = useRef(null);
  useEffect(() => { if (focused) setTimeout(() => ref.current?.focus(), 50); }, [focused]);
  return (
    <div style={{
      position: 'relative',
      display: 'flex', alignItems: 'center', gap: 8,
      padding: big ? '10px 10px 10px 22px' : '6px 6px 6px 14px',
      background: 'color-mix(in oklab, var(--paper), white 6%)',
      border: `1.5px solid ${accent ? 'var(--accent)' : 'var(--hairline)'}`,
      borderRadius: big ? 16 : 12,
      boxShadow: accent
        ? '0 0 0 4px color-mix(in oklab, var(--accent), transparent 88%), 0 8px 24px rgba(217,78,44,.18)'
        : '0 1px 0 rgba(0,0,0,.02), 0 8px 24px rgba(28,26,23,.06)',
      transition: 'all .2s',
    }}>
      <span style={{ color: accent ? 'var(--accent)' : 'var(--muted)', display: 'flex' }}>{I.link(big ? 18 : 14)}</span>
      <input ref={ref} value={value} onChange={(e) => onChange?.(e.target.value)}
        placeholder="Paste a YouTube, Vimeo, or TikTok link…"
        style={{
          flex: 1, border: 'none', outline: 'none', background: 'transparent',
          font: `500 ${big ? 20 : 14}px/1.2 'Inter', sans-serif`,
          color: 'var(--ink)',
          letterSpacing: '-.01em',
        }}/>
      <Btn primary={big} onClick={onPaste}
        icon={<span style={{ display: 'flex' }}>{I.paste(big ? 14 : 12)}</span>}
        small={!big}
        style={big ? { padding: '12px 18px', fontSize: 14 } : {}}>
        Paste {big && <span style={{ opacity: .55, marginLeft: 4, font: '500 11px/1 "JetBrains Mono", monospace' }}>⌘V</span>}
      </Btn>
    </div>
  );
}

// ─── Item row (active / queued / done) ──────────────────────────────────
function Item({ thumb, hue, title, channel, fmt, codec, status, progress, speed, eta, size, sizeTotal, savedAt }) {
  const isActive = status === 'active';
  const isQueued = status === 'queued';
  const isDone = status === 'done';
  return (
    <div style={{
      display: 'grid',
      gridTemplateColumns: '108px 1fr auto',
      gap: 16, alignItems: 'center',
      padding: 14,
      background: isActive ? 'color-mix(in oklab, var(--accent), transparent 95%)' : 'transparent',
      border: `1px solid ${isActive ? 'color-mix(in oklab, var(--accent), transparent 75%)' : 'var(--hairline)'}`,
      borderRadius: 12,
      transition: 'background .25s',
    }}>
      <PaintedThumb w={108} h={62} hue={hue} kind={fmt?.includes('MP3') || fmt?.includes('Audio') ? 'audio' : 'video'}
                    label={isDone ? 'saved' : (fmt?.split(' ')[1] || '')}/>
      <div style={{ minWidth: 0 }}>
        <div style={{
          font: '600 14px/1.3 "Inter", sans-serif', color: 'var(--ink)',
          letterSpacing: '-.01em',
          whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis',
        }}>{title}</div>
        <div style={{ font: '400 12px/1.3 "Inter", sans-serif', color: 'var(--muted)', marginTop: 3 }}>
          {channel}
        </div>
        <div style={{ marginTop: 8, display: 'flex', alignItems: 'center', gap: 8 }}>
          {isActive && (
            <>
              <div style={{ flex: 1, maxWidth: 360 }}>
                <Bar value={progress} height={4} animate/>
              </div>
              <span style={{ font: '500 11px/1 "JetBrains Mono", monospace', color: 'var(--accent)' }}>
                {progress}%
              </span>
              <span style={{ font: '400 11px/1 "Inter", sans-serif', color: 'var(--muted)' }}>
                {fmtBytes(size)} / {fmtBytes(sizeTotal)} · {speed} · {eta}
              </span>
            </>
          )}
          {isQueued && (
            <>
              <Pill mono>{fmt}</Pill>
              <Pill mono>~{fmtBytes(sizeTotal)}</Pill>
              <span style={{ font: '400 12px/1 "Instrument Serif", serif', fontStyle: 'italic', color: 'var(--muted)' }}>queued</span>
            </>
          )}
          {isDone && (
            <>
              <Pill mono>{fmt}</Pill>
              <Pill mono>{fmtBytes(sizeTotal)}</Pill>
              <span style={{ font: '400 12px/1 "Inter", sans-serif', color: 'var(--muted)' }}>{savedAt}</span>
            </>
          )}
        </div>
      </div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
        {isActive && (
          <>
            <Ring value={progress} size={42}/>
            <Btn ghost small icon={I.pause(14)} aria-label="pause"/>
          </>
        )}
        {isQueued && (
          <>
            <Btn ghost small icon={I.play(14)} aria-label="start"/>
            <Btn ghost small icon={I.x(14)} aria-label="remove"/>
          </>
        )}
        {isDone && (
          <>
            <Btn small icon={I.folder(13)}>Show</Btn>
            <Btn ghost small icon={I.retry(14)} aria-label="re-download"/>
          </>
        )}
      </div>
    </div>
  );
}

// ─── App ────────────────────────────────────────────────────────────────
function App() {
  const [state, setState] = useState('mid');
  const [dark, setDark] = useState(false);

  useEffect(() => {
    document.documentElement.classList.toggle('dark', dark);
  }, [dark]);

  // Wire the static state buttons in the header
  useEffect(() => {
    const btns = document.querySelectorAll('#states button[data-state]');
    btns.forEach(b => {
      b.classList.toggle('active', b.dataset.state === state);
      b.onclick = () => setState(b.dataset.state);
    });
    const darkBtn = document.getElementById('darkBtn');
    if (darkBtn) {
      darkBtn.classList.toggle('active', dark);
      darkBtn.onclick = () => setDark(d => !d);
    }
  }, [state, dark]);

  if (state === 'empty') return <EmptyState/>;
  if (state === 'done') return <DoneState/>;
  return <MidState/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
